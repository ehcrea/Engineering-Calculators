<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Precision Engineering Calculators</title>
  <meta name="description" content="Web calculators for precision mechanical design, based on the formulas of the free JPE Precision Point resource. Save, restore and export results as PDF.">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="apple-mobile-web-app-title" content="PE Calculators">
  <meta name="theme-color" content="#1f5ea8">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try { var t = localStorage.getItem('pec:v1:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    try { var l = localStorage.getItem('pec:v1:lang'); if (l) document.documentElement.lang = l; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="Skip to calculator">Skip to calculator</a>
  <header class="topbar">
    <button class="btn menu-toggle" id="menuToggle" aria-label="Show or hide the calculator list" title="Show or hide the calculator list" data-i18n-title="Show or hide the calculator list" data-i18n-aria-label="Show or hide the calculator list" aria-controls="sidebar" aria-expanded="true">☰</button>
    <h1><span data-i18n="Precision Engineering Calculators">Precision Engineering Calculators</span> <small data-i18n="formulas from JPE Precision Point">formulas from JPE Precision Point</small></h1>
    <div class="spacer"></div>
    <div class="toolbar">
      <div class="seg" id="unitSwitch" role="group" aria-label="Unit system" title="Switch between metric (SI) and US customary units" data-i18n-aria-label="Unit system" data-i18n-title="Switch between metric (SI) and US customary units">
        <button type="button" data-units="metric" aria-pressed="true"><span class="long" data-i18n="Metric">Metric</span><span class="short">SI</span></button><button type="button" data-units="us" aria-pressed="false">US</button>
      </div>
      <select class="btn lang-select" id="langSelect" aria-label="Language" title="Language" data-i18n-title="Language" data-i18n-aria-label="Language"></select>
      <button class="btn" id="btnLibrary" title="Saved calculations, JSON import/export" data-i18n="Saved" data-i18n-title="Saved calculations, JSON import/export">Saved</button>
      <button class="btn" id="btnTheme" title="Toggle light/dark theme" aria-label="Toggle theme" data-i18n-title="Toggle light/dark theme" data-i18n-aria-label="Toggle theme"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <input type="search" id="search" placeholder="Search calculators…" aria-label="Search calculators" data-i18n-placeholder="Search calculators…" data-i18n-aria-label="Search calculators">
      <div id="nav"></div>
    </nav>
    <main id="main" tabindex="-1"></main>
  </div>

  <dialog id="library" aria-labelledby="libTitle">
    <div class="dialog-head">
      <h3 id="libTitle" data-i18n="Saved calculations">Saved calculations</h3>
      <label style="font-size:13px"><input type="checkbox" id="libAll"> <span data-i18n="all calculators">all calculators</span></label>
      <button class="btn small" id="libClose" data-i18n="Close">Close</button>
    </div>
    <div class="dialog-body">
      <div class="toolbar" style="margin-bottom:10px">
        <button class="btn small" id="libExport" data-i18n="Export JSON">Export JSON</button>
        <button class="btn small" id="libImport" data-i18n="Import JSON">Import JSON</button>
        <input type="file" id="libFile" accept="application/json,.json" hidden>
      </div>
      <div id="libList"></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/core.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/i18n/de.js"></script>
  <script src="js/i18n/nl.js"></script>
  <script src="js/i18n/tr.js"></script>
  <script src="js/materials.js"></script>
  <script src="js/sections.js"></script>
  <script src="js/common.js"></script>
  <script src="js/calculators/flexures.js"></script>
  <script src="js/calculators/beams.js"></script>
  <script src="js/calculators/dynamics.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/theory.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
